<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qadam Club Admin</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .section {
            border: 1px solid #ccc;
            padding: 16px;
            border-radius: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            background: #248b9f;
            color: white;
            border: none;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            border: 1px solid #eee;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>

<body>
    <h1>Qadam Club Admin Panel <button id="logout" style="float:right; background:#6b7280;">Log out</button></h1>
    <p id="status" style="color:#b91c1c;"></p>

    <div class="grid">
        <div class="section">
            <h2>Create Challenge</h2>
            <input type="text" id="c-title" placeholder="Title">
            <textarea id="c-desc" placeholder="Description"></textarea>
            <input type="text" id="c-code" placeholder="Code (e.g. steps)">
            <input type="text" id="c-unit" placeholder="Unit (e.g. pages)">
            <input type="text" id="c-start" placeholder="Start Time (21:00)">
            <input type="text" id="c-end" placeholder="End Time (23:59)">
            <button onclick="createChallenge()">Create</button>
        </div>

        <div class="section">
            <h2>Challenges</h2>
            <div id="challenges-list">Loading...</div>
        </div>
    </div>

    <div class="section" style="margin-top: 20px;">
        <h2>Users</h2>
        <div id="users-list">Loading...</div>
    </div>

    <script>
        const API_URL = window.location.origin + "/api";
        // The admin API token is kept only for this browser tab (sessionStorage)
        // and sent as a Bearer token; it is never put into URLs.
        const TOKEN_KEY = 'qadam_admin_token';

        function getToken() {
            let token = sessionStorage.getItem(TOKEN_KEY);
            if (!token) {
                token = prompt("ADMIN_API_TOKEN:");
                if (token) sessionStorage.setItem(TOKEN_KEY, token.trim());
            }
            return sessionStorage.getItem(TOKEN_KEY);
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[ch]);
        }

        async function api(path, options = {}) {
            const res = await fetch(`${API_URL}${path}`, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${getToken()}`
                }
            });
            let data = null;
            try { data = await res.json(); } catch (e) { /* empty body */ }
            if (res.status === 401) sessionStorage.removeItem(TOKEN_KEY);
            if (!res.ok) throw new Error((data && data.error) || `HTTP ${res.status}`);
            return data;
        }

        function showError(e) {
            document.getElementById('status').textContent = e ? `Error: ${e.message}` : '';
        }

        async function createChallenge() {
            const data = {
                title: document.getElementById('c-title').value,
                description: document.getElementById('c-desc').value,
                code: document.getElementById('c-code').value,
                target_unit: document.getElementById('c-unit').value,
                time_window_start: document.getElementById('c-start').value,
                time_window_end: document.getElementById('c-end').value
            };
            try {
                await api('/admin/challenges', { method: 'POST', body: JSON.stringify(data) });
                showError(null);
                alert("Created!");
                loadData();
            } catch (e) {
                showError(e);
            }
        }

        async function setBanned(userId, banned) {
            try {
                await api(`/admin/users/${userId}/${banned ? 'ban' : 'unban'}`, { method: 'POST' });
                loadData();
            } catch (e) {
                showError(e);
            }
        }

        async function setActive(challengeId, active) {
            try {
                await api(`/admin/challenges/${challengeId}`, {
                    method: 'PATCH', body: JSON.stringify({ is_active: active })
                });
                loadData();
            } catch (e) {
                showError(e);
            }
        }

        async function loadData() {
            try {
                const challenges = await api('/admin/challenges');
                document.getElementById('challenges-list').innerHTML = `
                    <table>
                        <tr><th>Title</th><th>Code</th><th>Unit</th><th>Window</th><th>Status</th></tr>
                        ${challenges.map(c => `<tr>
                            <td>${escapeHtml(c.title)}</td><td>${escapeHtml(c.code)}</td>
                            <td>${escapeHtml(c.target_unit)}</td>
                            <td>${c.time_window_start ? escapeHtml(c.time_window_start + '-' + c.time_window_end) : 'all day'}</td>
                            <td><button data-challenge="${c.id}" data-active="${!c.is_active}">${c.is_active ? 'Deactivate' : 'Activate'}</button></td>
                        </tr>`).join('')}
                    </table>
                `;

                const users = await api('/admin/users');
                document.getElementById('users-list').innerHTML = `
                    <table>
                        <tr><th>Name</th><th>Username</th><th>Status</th><th></th></tr>
                        ${users.map(u => `<tr>
                            <td>${escapeHtml(u.full_name)}</td><td>${escapeHtml(u.username)}</td>
                            <td>${u.is_banned ? 'Banned' : 'Active'}</td>
                            <td><button data-user="${u.id}" data-ban="${!u.is_banned}">${u.is_banned ? 'Unban' : 'Ban'}</button></td>
                        </tr>`).join('')}
                    </table>
                `;
                showError(null);
            } catch (e) {
                showError(e);
            }
        }

        document.addEventListener('click', (event) => {
            const el = event.target;
            if (el.dataset.user) setBanned(el.dataset.user, el.dataset.ban === 'true');
            if (el.dataset.challenge) setActive(el.dataset.challenge, el.dataset.active === 'true');
        });
        document.getElementById('logout').addEventListener('click', () => {
            sessionStorage.removeItem(TOKEN_KEY);
            location.reload();
        });

        loadData();
    </script>
</body>

</html>
